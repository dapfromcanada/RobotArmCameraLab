# Camera white paper, machine-readable twin of AP-3200T-PGE.md. DRAFT v1, 2026-10-24 (fingerprint 20261024T131257Z).
# null = to be measured by the next fingerprint run.
schema_version: 1
model: AP-3200T-PGE
vendor: JAI Corporation
firmware_tested: ["0.0.3.4"]
design_mode: raw                      # profile mode for measurement and detection
startup:                              # never trust the boot state
  procedure: [load factory Default (UserSetLoad, live only), apply the design mode, read back, verify on the image]
  factory_default:                    # measured 2026-10-24
    pixel_format: RGB8
    exposure_us: 82402
    gain_db: 0
    white_balance: {red: 1.0, green: 1.0, blue: 1.0}
  design_mode_settings:               # complete, applied on top of Default
    pixel_format: RGB12V1Packed
    gain_db: 0
    white_balance: {red: 1.0, green: 1.0, blue: 1.0}
    prism.exposure_mode: common
    prism.gain_mode: master
  verify: [settings read back equal, "exposure x2 -> signal x2.00", dark black ~100 DN]
  rgb12_bypasses: [gamma LUT, white balance]   # LUTMode is not even writable in RGB12V1Packed
  boot_user_set: {feature: false, lab: Default (nothing saved), site: UserSet1 after a confirmed setup}   # boots from UserSet1 once one is saved
  user_set_stores: null               # not measured (needs a human power cycle)
  user_set_save_needs_stream_stopped: true
sensor:
  name: 3 x global-shutter CMOS behind a prism (sensor not named in the manual)
  megapixels: 3.2
  pixels: [2064, 1544]
  pixel_um: 3.45
  optical_format: "1/1.8 type, F4 prism optical system"
  colour: prism                       # R, G, B on separate sensors: no Bayer, full resolution per colour
  shutter: global
signal_path:
  gamma_default: 0.45                 # 8/10-bit formats; bypassed in RGB12V1Packed
  colour_matrix: present (bypassed in RGB12V1Packed per profile notes)
outputs:
  linear: {pixel_format: RGB12V1Packed, bits: 12, gain_per_exposure_doubling: null}   # to verify with two-d verify
  formats: [RGB8, RGB10V1Packed, RGB10p32, RGB12V1Packed]
  black_level_control: {node: "BlackLevel[DigitalAll]", range_lsb_12bit: [-133, 255], default: 0, black_at_default_dn: 100}
controls:
  exposure_us_min: 14.73              # manual, 8/10-bit; plus a sensor offset
  exposure_us_max: 8000000            # manual (performance verified to 1 s)
  gain: {kind: analog, master_range_db: [0, 18], individual_range_db: [0, 36.13], master_zero_is_individual_plus_db: 6}
  white_balance: "per-sensor analog gain (AnalogRed/AnalogBlue -6.5..12 dB): keep 1.0 in raw"
  per_sensor_exposure: "ExposureTimeMode Individual"
  user_sets: {slots: [Default, UserSet1, UserSet2, UserSet3], boot_set: false}
timing:
  fps_full_frame: {RGB8: 12.0, RGB10V1Packed: 9.0, RGB10p32: 9.0, RGB12V1Packed: 8.0}   # GigE bandwidth (manual: same)
  sensor_max_fps: 24.2                # manual: the sensor is twice as fast as the interface
  row_time_us: null                   # global shutter: no row skew
  pipeline:                           # fingerprint 2026-10-24, RGB12V1Packed, 82 ms exposure
    frame_interval_ms: 123            # 14.3 MB on the wire = 116 MB/s (GigE)
    frame_mb_in_memory: 19.1          # 3 x uint16 planes
    pc_to_float_ms: 20                # x86_64, 24 CPUs; no debayer needed
  trigger_to_image_ms: null           # measured on the machine with the production trigger (PTP for exposure start)
  settle_frame_periods: null          # 2026-10-24 test invalid (start frame saturated); re-measure
setting_names:                        # camera_lab key -> GenICam node
  exposure_us: ExposureTime
  gain_db: "Gain[AnalogAll] (multiplier, converted to dB by the driver)"
  pixel_format: PixelFormat
  frame_rate_hz: AcquisitionFrameRate
  white_balance: "Gain[AnalogRed / AnalogGreen / AnalogBlue]"
  prism.exposure_mode: "ExposureTimeMode (Common / Individual)"
  prism.gain_mode: "IndividualGainMode (Off = master / On)"
  prism.exposure_red_us: "ExposureTime[Red] (Individual mode)"
performance:                          # RGB12V1Packed, master gain 0 dB, BlackLevel 0, common exposure
  conditions: {gain_db: 0, black_level_pct: null}   # BlackLevel is in LSB on this camera; 0 (default) -> black 100 DN
  full_scale_dn: 4095
  saturation_dn: 4094
  runs: 3
  units: 1
  black_dn: 100
  read_noise_dn: 1.74
  read_noise_e: 1.95
  row_noise_dn: 0.29
  dsnu_dn: 3.6
  system_gain_dn_per_e: 0.893
  full_well_e: 4470                   # ADC-limited at master 0 dB (= +6 dB over individual 0 dB)
  dynamic_range_db: 67.2
  dynamic_range_stops: 11.2
  dark_current_dn_s: 0
  linearity_error_pct: 0.11
  peak_snr: 64.8                      # shot-noise limited: sqrt(4470 e-) = 67
  prnu_pct: 0.69
  vignetting_corner_ratio: 0.93       # JAI 6 mm 0628-C3, about f/4; lens- and iris-dependent
  noise_model: {formula: "sigma^2 = read^2 + signal_dn * 0.893", a_dn2: 3.03, b_dn: 0.893}
  snr_vs_signal:                      # level fraction of full scale -> SNR (2026-10-24)
    monotonic: true
    points: {0.021: 9.6, 0.031: 11.8, 0.054: 15.7, 0.077: 18.9, 0.116: 23.2, 0.155: 26.7, 0.233: 32.9, 0.312: 37.9, 0.39: 42.4, 0.469: 46.4, 0.548: 50.1, 0.626: 53.5, 0.705: 56.7, 0.785: 59.9, 0.904: 64.8}
    best: {level: 0.904, snr: 64.8}
  quantization:
    - {from_level: 0.0, step_dn: 1}
  colour: {light: "DC LED floods (bench)", r_over_g: 1.03, b_over_g: 0.82, prnu_pct: {R: 0.68, G: 0.69, B: 0.68}}
  hot_pixels_8sigma_100ms: 3504       # unit U330439; most mild (120 above 200 DN, 16 above 400 DN)
  repeatability_spread_pct: {dark: 1.0, flat: 0.3, colour: 0.4}
limitations:
  - "12-bit at 8 fps over GigE (12 fps in 8-bit): the sensor could do 24 fps"
  - "full well 4470 e- at master gain 0 dB: peak SNR about 65; dynamic range 67 dB (11 stops)"
  - "gamma 0.45 and white balance are on in 8/10-bit formats: only RGB12V1Packed is raw"
  - "no boot-set feature: once any user set is saved the camera boots from UserSet1"
diagnostics:
  - {signature: "doubling exposure gives less than x2", meaning: "not in RGB12V1Packed (gamma LUT on)"}
  - {signature: "colours already balanced in raw", meaning: "white balance gains not 1.0"}
  - {signature: "black far from 100 DN with the cap on", meaning: "BlackLevel changed, or a fault / heat (DeviceTemperature)"}
  - {signature: "settings differ after power-up", meaning: "normal once a user set was saved: boots from UserSet1"}
  - {signature: "UserSetSave fails", meaning: "the stream must be stopped"}
  - {signature: "red / blue fringes at edges", meaning: "prism or lens misalignment, or a lens not made for prism cameras"}
state_checks:
  linear_output: {method: "exposure E and 2E, 5-40 % of full scale", expect_ratio: [1.95, 2.05]}
  dark: {method: "lens cap on, 10 ms, gain 0, BlackLevel 0", black_dn: 100, read_noise_dn: 1.9}
  settling: {expect_stale_frames: null}
open_questions:
  - "gain behaviour not measured (gain is pinned in raw): does IndividualGainMode at 0 dB double the full well (manual: master 0 dB = individual +6 dB)?"
  - "what does the prism's F4 rating mean for an f/2.8 lens (colour shading toward the corners)?"
  - "settling after a setting change (2026-10-24 test invalid)"
  - "which features a user set stores (power-cycle test)"
  - "exposure x2 linearity check on the image (two-d verify)"
  - "temperature behaviour"
