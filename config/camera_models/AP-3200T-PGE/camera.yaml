      green: 1.0
      blue: 1.0
    prism.exposure_mode: common
    prism.gain_mode: master
  verify:
  - settings read back equal
  - exposure x2 -> signal x2.00
  - dark black ~100 DN
  rgb12_bypasses:
  - gamma LUT
  - white balance
  boot_user_set:
    feature: false
    lab: Default (nothing saved)
    site: UserSet1 after a confirmed setup
  user_set_stores:
  - exposure_us
  - gain_db
  - pixel_format
  - white_balance
  software_reboot:
