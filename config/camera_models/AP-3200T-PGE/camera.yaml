limitations:
- '12-bit at 8 fps over GigE (12 fps in 8-bit): the sensor could do 24 fps'
- 'full well 4470 e- at master gain 0 dB: peak SNR about 65; dynamic range 67 dB (11
  stops)'
- 'gamma 0.45 and white balance are on in 8/10-bit formats: only RGB12V1Packed is
  raw'
- 'no boot-set feature: once any user set is saved the camera boots from UserSet1'
diagnostics:
- meaning: not in RGB12V1Packed (gamma LUT on)
  signature: doubling exposure gives less than x2
- meaning: white balance gains not 1.0
  signature: colours already balanced in raw
- meaning: BlackLevel changed, or a fault / heat (DeviceTemperature)
  signature: black far from 100 DN with the cap on
- meaning: 'normal once a user set was saved: boots from UserSet1'
  signature: settings differ after power-up
- meaning: the stream must be stopped
  signature: UserSetSave fails
- meaning: prism or lens misalignment, or a lens not made for prism cameras
  signature: red / blue fringes at edges
state_checks:
  linear_output:
    method: exposure E and 2E, 5-40 % of full scale
    expect_ratio:
    - 1.95
    - 2.05
  dark:
    method: lens cap on, 10 ms, gain 0, BlackLevel 0, camera warm (~60 C)
    black_dn: 100
    read_noise_dn: 1.8
  settling:
    expect_stale_frames: 0
open_questions:
