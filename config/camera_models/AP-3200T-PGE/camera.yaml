  - load factory Default (UserSetLoad
  - live only)
  - apply the design mode
  - read back
  - verify on the image
  factory_default:
    pixel_format: RGB8
    exposure_us: 82402
    gain_db: 0
    white_balance:
      red: 1.0
      green: 1.0
      blue: 1.0
