# Lucid Triton TRI054S-C (s/n 233100505) — camera profile.
# Human-edited. Safety limits still apply to every setting (safety_limits.yaml).
schema_version: 1
serial: "233100505"
label: Lucid Triton TRI054S-C (HDR, rolling shutter, Bayer)

characteristics:
  shutter: rolling          # live SensorShutterMode = Rolling: static scenes only
  colour: bayer             # BayerRG; RGB8 is debayered on the camera
  hdr_capable: true         # 4 HDR channels, each with its own exposure + analog gain
  black_level: 0.0000024    # raw_hdr (BayerRG24, BlackLevel 1): ≈ 40 DN of 2^24 (measured 2026-10-23)
  notes:
    - "In HDR mode (HDRTuningEnable on) ExposureTime and Gain are read-only; tune the HDR channels instead."
    - "The manual only lists the HDR node names (HDR Control L2165); behaviour is being characterised at the bench."

default_mode: raw_hdr

# Preferred ranges (guidance for the tuner / setup / agent; never a hard limit).
# Exposure budget = one frame at the frame rate the job needs, which depends on the format:
# raw_hdr (BayerRG24) runs at most 6.93 fps over GigE → one frame ≈ 144 ms; the 8-bit display
# modes run at 20.8 fps → ≈ 48 ms. Longer exposures lower the frame rate. The HDR channel
# gains stay fixed (not knobs). Too dark at the budget → ask for more light, never gain.
working_range:
  exposure_us: {max: 200000}
  gain_db: {min: 0, max: 18}
  "hdr.ch*.exposure_us": {max: 47900}

# Fingerprint bench recipe (Phase 11 strict procedure, Derek 2026-10-22/23). The human sets
# exactly this; camera_lab measures the light before each stage and stops if it differs.
# Floods at full; only the iris changes. From the 2026-10-23 iris sweep (80 % point of
# each channel, needs >= 20 ms = 10x the 2 ms bench minimum): ch3 68 ms at f/1.4, ch2 50 ms
# at f/8, ch1 29 ms at f/16. ch0 (~22x ch1) is saturated even at f/16: it needs ~15x less
# light (ND filter or more diffuser) and is not in the recipe yet.
fingerprint:
  lens: kowa_8mm
  reference: {dimmer: 10, f_number: 1.4}    # darks, timing, flat, colour, noise: iris open
  channel_stages:
    - {dimmer: 10, f_number: 1.4, channels: [HDRChannel3]}
    - {dimmer: 10, f_number: 8, channels: [HDRChannel2]}
    - {dimmer: 10, f_number: 16, channels: [HDRChannel1]}
  notes:
    - "Floods at full throughout; only the iris changes (f/1.4, f/8, f/16, back to f/1.4)."
    - "HDRChannel0 not measured: needs ~15x less light than f/16 (ND filter / more diffuser)."

modes:
  raw_hdr:
    strategy: linear
    description: >
      Lucid's raw path (KB "Tonemapping images from LUCID's TRI054S-CC"): BayerRG24 linear
      24-bit HDR (> 120 dB), the 4 channels combined on the sensor; LUT and colour
      transformation off. HDR tuning off, so ExposureTime sets all four channel exposures
      and the factory channel gains stay. Verified linear 2026-10-22 (x2.00 per doubling).
      Tone mapping is done on the PC. The design mode of this camera: fingerprint and detect here.
    # gain_db 0: in this mode Gain is a digital multiplier after the HDR merge (no SNR, it
    # only clips highlights; 28.6 dB from an old user set cost 4.75 stops, 2026-10-23).
    # black.level 1 (+40 DN): at the default 0, 64 % of dark pixels sit at 0 (noise clipped).
    # white balance 1/1/1: BalanceRatio multiplies the raw 24-bit data, black included
    # (factory Default even runs auto white balance); balance colour on the PC.
    settings:
      pixel_format: BayerRG24
      gain_db: 0
      white_balance: {red: 1.0, green: 1.0, blue: 1.0}
      advanced:
        hdr.enabled: "off"
        hdr.output: HDR
        lut.enabled: "off"
        color.transformation: "off"
        black.level: 1.0
    knobs: [exposure_us]
    # One brightness rule for this mode (tuner, capture scores, site tool, white paper):
    # expose to the right — the highlights (99th percentile) at 80 % of full scale, never
    # clipped. The SNR of this linear HDR output is best near the top (287 at 79 %).
    scoring:
      level_metric: p99
      target_mean: 0.80       # for level_metric p99: the highlights, not the mean
      clip_max_pct: 0.2
      black_threshold: 0.000005   # ≈ 84 DN: in the noise floor of 24-bit data (black 40, σ 2.4)
  hdr:
    strategy: hdr
    description: >
      Display path: 12-bit output through the factory LUT (gamma 0.5, GammaPointFive) with
      HDR tuning on; tunes the channels' shared exposure; channel gains stay as set.
      The LUT makes the output non-linear (x1.41 per exposure doubling).
    settings:
      advanced:
        hdr.enabled: "on"
        hdr.output: HDR
        lut.enabled: "on"
        color.transformation: "on"
    knobs: [hdr.ch0.exposure_us, hdr.ch1.exposure_us, hdr.ch2.exposure_us, hdr.ch3.exposure_us]
    scoring:
      target_mean: 0.35       # LUT-compressed output; a lower mean keeps highlights
      clip_max_pct: 0.2
      black_max_pct: 2.0
  linear:
    strategy: linear
    description: >
      HDR tuning off, factory LUT on: ExposureTime / Gain control of the LUT-compressed
      output (rolling shutter, static scenes). Not linear despite the name (gamma-0.5 LUT);
      use raw_hdr for linear data.
    settings:
      advanced:
        hdr.enabled: "off"
        lut.enabled: "on"
        color.transformation: "on"
    knobs: [exposure_us, gain_db, white_balance]
