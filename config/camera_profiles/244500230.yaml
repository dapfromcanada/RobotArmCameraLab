# Lucid Triton TRI089S-M (s/n 244500230, fw 1.97.0.0) — camera profile.
# Human-edited. Safety limits still apply to every setting (safety_limits.yaml).
# Node map dump: docs/cameras/TRI089S-M_244500230_fw1.97.0.0_nodemap.tsv
schema_version: 1
serial: "244500230"
label: Lucid Triton TRI089S-M (mono, global shutter, 4096 x 2160)

characteristics:
  shutter: global           # live SensorShutterMode = Global
  colour: mono              # Mono8/10/12/16 (+ packed); no white balance
  hdr_capable: false        # no HDR nodes
  black_level: null         # not measured yet
  notes:
    - "Free-run 12.6 fps at Mono8 full frame, 8.4 fps at Mono12p (GigE link limit, measured 2026-10-21)."
    - "BalanceRatio* / BalanceWhiteAuto nodes are listed but neither readable nor writable."
    - "Has Gamma (0.2-2.0); base settings keep gamma 1.0 so images stay linear for measurement."

default_mode: raw

modes:
  raw:
    strategy: linear
    description: >
      The camera's design mode for measurement and detection (2026-10-26, like the JAI's raw):
      12-bit mono (Mono12p), gain 0 dB, gamma 1.0, LUT off, BlackLevel 1 (factory Default is
      Mono8, gain 0, gamma 1, LUT off, BlackLevel 0 - read live 2026-10-26; a black level above
      0 keeps dark noise from being clipped at 0, as on the TRI054S). Exposure is the only knob.
      Fingerprint, verify, site tool and tune use it.
    settings:
      pixel_format: Mono12p
      gain_db: 0
      gamma: 1.0
      advanced: {lut.enabled: "off", black.level: 1.0}
    knobs: [exposure_us]
    scoring:
      level_metric: p99        # one brightness rule for linear raw data: highlights at 80 %
      target_mean: 0.80
      clip_max_pct: 0.2
  linear:
    strategy: linear
    description: >
      Linear mono: exposure first, then gain only if exposure runs out. Gamma 1.0.
    settings:
      gamma: 1.0
    knobs: [exposure_us, gain_db]
