# JAI Apex AP-3200T-PGE (s/n U330439) — camera profile.
# Human-edited. Safety limits still apply to every setting (safety_limits.yaml).
schema_version: 1
serial: "U330439"
label: JAI Apex AP-3200T-PGE (3-CMOS prism, global shutter)

characteristics:
  shutter: global           # manual L599: "three global shutter CMOS image sensors"
  colour: prism             # R, G, B on separate sensors: no Bayer, full resolution per channel
  hdr_capable: false
  black_level: 0.031        # measured 2026-10-21: ~33 counts at 10 bit with BlackLevel = 0
  notes:
    - "Gain is a multiplier on the camera (converted to dB by the driver); WB = per-sensor gain."
    - "Per-sensor exposure (ExposureTimeMode Individual) can balance colour without gain noise."
    - "RGB12V1Packed bypasses gamma and white balance in the camera."

default_mode: raw

# How the human sets the bench for this camera's fingerprint (lens from
# config/fingerprint_bench.yaml; camera_lab fills in the lens / iris, the human enters nothing).
fingerprint:
  lens: jai_6mm_0628
  # floods full, iris fully open: an end stop the human can always find again (Derek
  # 2026-10-24: a middle mark on this short-throw ring cannot be repeated). Global shutter:
  # the bench's 1 ms minimum (not 2 ms) leaves room for the sweep at f/2.8.
  reference: {dimmer: 10, f_number: 2.8}
  notes:
    - "Floods at full throughout; iris fully open (f/2.8) for every row, f/5.6 for the lens row."

modes:
  raw:
    strategy: linear
    description: >
      The camera's design mode for measurement and detection (Derek 2026-10-24): 12-bit raw
      per sensor (RGB12V1Packed: gamma and white balance are bypassed in the camera — the gamma
      LUT is not even writable in this format, 2026-10-24), gain
      0 dB, white balance 1/1/1, one common exposure for the three sensors. Exposure is the
      only knob; colour is balanced on the PC. Fingerprint, verify, site tool and tune use it.
    settings:
      pixel_format: RGB12V1Packed
      gain_db: 0
      white_balance: {red: 1.0, green: 1.0, blue: 1.0}
      advanced:
        prism.exposure_mode: common
        prism.gain_mode: master
    knobs: [exposure_us]
    scoring:
      level_metric: p99        # one brightness rule for linear raw data: highlights at 80 %
      target_mean: 0.80
      clip_max_pct: 0.2
  prism:
    strategy: prism
    description: >
      Exposure → gain → white balance. White balance by per-sensor gain (default) or by
      per-sensor exposure (options.wb_method: exposure).
    settings:
      advanced:
        prism.exposure_mode: common
    knobs: [exposure_us, gain_db, white_balance, prism.exposure_red_us, prism.exposure_green_us,
            prism.exposure_blue_us]
    options:
      wb_method: gain
