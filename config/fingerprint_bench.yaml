# Fingerprint bench (Phase 11 strict procedure). Human-edited.
# camera_lab uses it to check that the light the human set matches the recipe in the
# camera profile (fingerprint:) before it measures anything.
schema_version: 1

# Shortest exposure for lit measurements. The bench LEDs ripple (DC floods ~4 kHz, dimmed
# panels 120 Hz); a rolling shutter turns short exposures of that into row bands. At >= 2 ms
# the floods' ripple adds < ~1 % to the noise (measured 2026-10-23).
min_exposure_us: 2000
# Global-shutter cameras: no row bands, only frame-to-frame variation. JAI AP-3200T under
# the floods (iris open, 2026-10-24): 6.5 % at 0.05 ms, 3.8 % at 0.1, 2.2 % at 0.25,
# 1.0 % at 0.5, 0.8 % at 1, 0.7 % at 2, 0.6 % at 5 ms (0.6 % is the floor at any exposure).
min_exposure_global_us: 1000

light:
  label: "DC LED floods at full on the opal acrylic diffuser (bench light since 2026-10-23)"
  # The floods have one setting: full. Recipes use dimmer 10 = full.
  # (The dimmed LED panels are not used: they flicker at 120 Hz. Their dimmer table is in
  # docs/experiments/20261021_findings.md, 2026-10-22.)
  relative:
    10: 1.0

lenses:
  kowa_8mm:
    label: "Kowa 8 mm"
    # Printed stops on the ring; 5.6 and 11 are dots between 4–8 and 8–16 (hard to set
    # exactly: recipes use printed marks only). Fully open = the smallest.
    f_stops: [1.4, 2, 2.8, 4, 5.6, 8, 11, 16]
    # Measured light relative to fully open (TRI054S-C, floods, acrylic, 2026-10-23;
    # docs/experiments/20261023_iris_sweep_tri054s.txt). The lens passes more light when
    # stopped down than (1.4 / f)² says.
    transmission:
      2: 0.74
      2.8: 0.352
      4: 0.187
      5.6: 0.093
      8: 0.0386
      11: 0.028
      16: 0.0094

  jai_6mm_0628:
    label: "JAI 6 mm 0628-C3"
    # JAI JVS-C118-0628-C3, 6 mm f/2.8, made for the AP-3200T's prism. Stops assumed from
    # f/2.8 in whole stops (ring markings not yet checked); transmission not measured, so
    # nominal (2.8 / f)² is used.
    f_stops: [2.8, 4, 5.6, 8, 11, 16]

notes:
  - "One f-stop nominally halves the light; fully open is an end stop (repeatable)."
